name: Deploy an approved BMOAS revision
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    environment: bmoas-aws
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm run check && npm test
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build, publish and update services
        env:
          REPOSITORY: ${{ vars.ECR_REPOSITORY_URI }}
          FOUNDATION: ${{ vars.FOUNDATION_STACK }}
          SERVICES: ${{ vars.SERVICES_STACK }}
          WRITER: ${{ vars.MONGO_WRITER_SECRET_ARN }}
          READER: ${{ vars.MONGO_READER_SECRET_ARN }}
          TOKEN: ${{ vars.API_TOKEN_SECRET_ARN }}
        run: |
          IMAGE="$REPOSITORY:$GITHUB_SHA"
          docker build --platform linux/amd64 -t "$IMAGE" .
          docker push "$IMAGE"
          aws cloudformation deploy --stack-name "$SERVICES" --template-file infra/services.json --capabilities CAPABILITY_IAM --parameter-overrides "FoundationStack=$FOUNDATION" "ImageUri=$IMAGE" "MongoWriterSecretArn=$WRITER" "MongoReaderSecretArn=$READER" "ApiTokenSecretArn=$TOKEN" --no-fail-on-empty-changeset
